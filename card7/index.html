<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brave Beginner - Fruit Slice report card</title>
<meta property="og:title" content="My Fruit Slice report card: Brave Beginner!">
<meta property="og:image" content="fruit-slice-report-card-brave-beginner.png">
<style>
  @font-face { font-family: Barlow; font-weight: 600; src: url(../fonts/Barlow-SemiBold.ttf); }
  @font-face { font-family: PlexArabic; font-weight: 700; src: url(../fonts/IBMPlexSansArabic-Bold.ttf); }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#eef3fa; color:#18518F; text-align:center; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.5rem; margin:8px 0 14px; }
  img { width:100%; border-radius:24px; box-shadow:0 8px 30px rgba(24,81,143,.25); }
  a.btn { display:inline-block; margin-top:20px; padding:16px 36px; border-radius:40px; background:linear-gradient(90deg,#9E7DB8,#238DC1); color:#fff;
          font-weight:700; font-size:1.2rem; text-decoration:none; letter-spacing:.06em; }
  p.hint { font-size:.95rem; opacity:.8; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Your report card is ready: Brave Beginner!</h1>
  <h1 dir="rtl" lang="ar">بطاقة إنجازك جاهزة: مبتدئ شجاع!</h1>
  <img id="card" src="fruit-slice-report-card-brave-beginner.png" alt="Brave Beginner report card">
  <a class="btn" id="dl" href="fruit-slice-report-card-brave-beginner.png" download="fruit-slice-report-card-brave-beginner.png">Download / تحميل</a>
  <p class="hint">On iPhone: tap and hold the picture, then choose <b>Save to Photos</b>.</p>
  <p class="hint" dir="rtl" lang="ar">على آيفون: اضغط مطولا على الصورة ثم اختر <b>حفظ في الصور</b>.</p>
</main>
<script>
(function () {
  // The player's name comes after '#' in the link from the floor (#n=Sara). The part after '#' stays on this phone:
  // it is never sent to GitHub or anywhere else. The name is drawn onto the card here, so the saved picture has it.
  var NAME_CY = 166, NAME_H = 92, NAME_MAX_W = 760;
  function clean(s) {
    s = (s || '').replace(/[^\p{L}\p{M} .'\u2019-]/gu, '').replace(/\s+/g, ' ').trim();
    return s.slice(0, 20).trim();
  }
  var name = 'Player';
  try {
    var m = /(?:^|[#&])n=([^&]*)/.exec(location.hash);
    if (m) { var c = clean(decodeURIComponent(m[1])); if (c) name = c; }
  } catch (e) {}
  var isAr = /[\u0600-\u06FF]/.test(name);
  var file = 'fruit-slice-report-card-brave-beginner.png';
  var img = document.getElementById('card'), dl = document.getElementById('dl');
  var base = new Image();
  base.onload = function () {
    var fonts = document.fonts ? Promise.all([document.fonts.load('600 54px Barlow'), document.fonts.load('700 54px PlexArabic')]) : Promise.resolve();
    fonts.catch(function () {}).then(function () {
      var cv = document.createElement('canvas'); cv.width = base.naturalWidth; cv.height = base.naturalHeight;
      var g = cv.getContext('2d');
      g.drawImage(base, 0, 0);
      var size = 54, family = isAr ? 'PlexArabic' : 'Barlow', weight = isAr ? 700 : 600;
      g.font = weight + ' ' + size + 'px ' + family + ', sans-serif';
      while (g.measureText(name).width > NAME_MAX_W - 90 && size > 30) { size -= 2; g.font = weight + ' ' + size + 'px ' + family + ', sans-serif'; }
      var w = Math.min(NAME_MAX_W, g.measureText(name).width + 90), x = cv.width / 2 - w / 2, y = NAME_CY - NAME_H / 2;
      var grad = g.createLinearGradient(x, 0, x + w, 0); grad.addColorStop(0, '#9E7DB8'); grad.addColorStop(1, '#238DC1');
      g.fillStyle = grad; g.beginPath();
      var r = NAME_H / 2;
      g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + NAME_H, r); g.arcTo(x + w, y + NAME_H, x, y + NAME_H, r);
      g.arcTo(x, y + NAME_H, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = isAr ? 'rtl' : 'ltr';
      g.fillText(name, cv.width / 2, NAME_CY + 2);
      cv.toBlob(function (b) {
        var url = URL.createObjectURL(b);
        img.src = url; dl.href = url;
        dl.download = file.replace('.png', '') + (name !== 'Player' ? '-' + name.replace(/\s+/g, '-') : '') + '.png';
        setTimeout(function () { dl.click(); }, 400);   // start the download (Android / desktop); iOS: hold the picture
      }, 'image/png');
    });
  };
  base.src = file;
})();
</script>
</body>
</html>
